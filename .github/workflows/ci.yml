name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    name: Front (lint, types, tests, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  database:
    name: Base de données (migrations + tests SQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - run: scripts/test-db.sh

  # Applique les migrations sur le projet Supabase (si les secrets sont configurés).
  migrate:
    name: Migrations Supabase
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [web, database]
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - id: check
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_DB_PASSWORD" ] && [ -n "$SUPABASE_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Supabase non configuré : migrations ignorées (voir README)."
          fi
      - if: steps.check.outputs.enabled == 'true'
        uses: actions/checkout@v4
      - if: steps.check.outputs.enabled == 'true'
        uses: supabase/setup-cli@v1
        with:
          # Version figée : « latest » interroge l'API GitHub sans authentification
          # et échoue quand sa limite de requêtes est atteinte.
          version: 2.121.0
      - if: steps.check.outputs.enabled == 'true'
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push

  # La branche dev est publiée sous /dev/, mais Pages ne se déploie que depuis
  # main : on relance donc la CI de main, qui reconstruit les deux versions.
  redeploy:
    name: Relance le déploiement (prod + dev)
    if: github.ref == 'refs/heads/dev' && github.event_name == 'push'
    needs: [web, database]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh workflow run ci.yml --ref main -R "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  deploy:
    name: Déploiement GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [migrate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          # URL et clé « anon » publiques du projet Supabase (variables du dépôt).
          # Sans elles, le site tourne en mode démo.
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
      # Version de test (branche dev) sous /dev/, en mode démo : sans Supabase,
      # les données restent dans le navigateur. Un échec ici ne bloque pas la prod.
      - id: dev
        continue-on-error: true
        run: git ls-remote --exit-code --heads origin dev
      - if: steps.dev.outcome == 'success'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-src
      - if: steps.dev.outcome == 'success'
        continue-on-error: true
        working-directory: dev-src
        run: npm ci && npm run build -- --outDir ../dist/dev
        env:
          BASE_PATH: /${{ github.event.repository.name }}/dev/
          VITE_APP_ENV: dev
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
