name: Supabase keep-alive

# Les projets Supabase gratuits sont mis en pause après 7 jours sans activité.
# Chaque jour, on liste tous les projets du compte (ceux créés plus tard compris)
# et on exécute une vraie requête sur chacun : SQL via l'API de gestion, puis un
# appel public (contrôle de santé de l'authentification, avec la clé anon).
# Le 1er du mois, appelle aussi Brevo pour garder sa clé API active (voir
# supabase/migrations/20261112170000_brevo_keepalive.sql) ; la tâche échoue, et
# GitHub prévient par email, si Brevo refuse la clé.
on:
  schedule:
    - cron: '23 4 * * *' # tous les jours vers 5 h 23 (heure de Paris en hiver)
  workflow_dispatch:

jobs:
  ping:
    name: Maintient les projets Supabase éveillés
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      API: https://api.supabase.com/v1
    steps:
      - name: Interroge chaque projet
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN absent : impossible de lister les projets."
            exit 1
          fi
          auth=(-H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN")

          projects=$(curl -fsS "${auth[@]}" "$API/projects")
          echo "$projects" | jq -r '.[] | "\(.ref)\t\(.status)\t\(.name)"' > projects.tsv
          [ -s projects.tsv ] || { echo "::warning::Aucun projet Supabase trouvé."; exit 0; }

          failed=0
          while IFS=$'\t' read -r ref status name; do
            if [ "$status" != "ACTIVE_HEALTHY" ]; then
              echo "::warning::$name ($ref) est « $status » : rien à réveiller automatiquement, à vérifier dans le tableau de bord Supabase."
              continue
            fi

            # 1. Requête SQL réelle sur la base
            if curl -fsS "${auth[@]}" -H "Content-Type: application/json" \
                 -d '{"query":"select now()"}' "$API/projects/$ref/database/query" > /dev/null; then
              sql=ok
            else
              sql=échec; failed=1
            fi

            # 2. Appel public avec la clé anon (la racine REST est réservée à la clé de service)
            key=$(curl -fsS "${auth[@]}" "$API/projects/$ref/api-keys" 2>/dev/null \
                    | jq -r '[.[] | select(.name == "anon")][0].api_key // empty' || true)
            if [ -n "$key" ]; then
              rest=$(curl -sS -o /dev/null -w '%{http_code}' -H "apikey: $key" \
                       "https://$ref.supabase.co/auth/v1/health" || echo "injoignable")
              [ "$rest" = "200" ] || failed=1
            else
              rest="ignoré (pas de clé anon)"
            fi

            # 3. Le 1er du mois (ou au lancement manuel) : appel à Brevo pour que la
            #    clé API ne soit pas désactivée après 90 jours sans usage.
            #    Seulement pour les projets qui ont la fonction brevo_keepalive().
            brevo=""
            if [ "$(date -u +%d)" = "01" ] || [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
              req=$(curl -fsS "${auth[@]}" -H "Content-Type: application/json" \
                      -d '{"query":"select case when to_regprocedure('\''public.brevo_keepalive()'\'') is null then '\''absent'\'' else coalesce(public.brevo_keepalive()::text, '\''non configuré'\'') end as r"}' \
                      "$API/projects/$ref/database/query" | jq -r '.[0].r // empty' || true)
              case "$req" in
                absent) ;;
                "") brevo=", Brevo échec"; failed=1 ;;
                "non configuré") brevo=", Brevo non configuré"
                  echo "::warning::$name ($ref) : clé brevo_api_key absente du Vault." ;;
                *)
                  sleep 15 # pg_net envoie la requête en arrière-plan
                  code=$(curl -fsS "${auth[@]}" -H "Content-Type: application/json" \
                           -d "{\"query\":\"select status_code from net._http_response where id = $req\"}" \
                           "$API/projects/$ref/database/query" | jq -r '.[0].status_code // empty' || true)
                  brevo=", Brevo ${code:-sans réponse}"
                  if [ "$code" != "200" ]; then
                    failed=1
                    echo "::error::$name ($ref) : Brevo répond « ${code:-rien} ». Clé API expirée ou invalide ? Les emails de vérification ne partent plus : régénérer la clé et la remplacer dans le Vault (brevo_api_key)."
                  fi ;;
              esac
            fi

            echo "$name ($ref) : SQL $sql, API $rest$brevo"
          done < projects.tsv

          exit $failed
